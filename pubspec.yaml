name: nexus_ai
description: "Nexus AI - Enterprise Student Life Operating System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Routing
  go_router: ^14.2.0

  # Networking & REST API
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.4.0

  # Data & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Firebase & Notifications (Infrastructure)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

  # Utilities & Helpers
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fpdart: ^1.1.0
  logger: ^2.3.0
  path: ^1.9.0

  # Media & Visual Assets
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  injectable_generator: ^2.6.2
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
