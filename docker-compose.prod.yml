version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nexus_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: nexus_backend_prod
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=nexus
      - DATABASE_PASSWORD=nexus_prod_secret
      - DATABASE_NAME=nexus_ai_prod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OTEL_SERVICE_NAME=nexus-ai-prod
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres_prod
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_prod_secret
      POSTGRES_DB: nexus_ai_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: nexus_redis_prod
    volumes:
      - redis_prod_data:/data
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: nexus_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: nexus_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

  loki:
    image: grafana/loki:latest
    container_name: nexus_loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro

  promtail:
    image: grafana/promtail:latest
    container_name: nexus_promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nexus_jaeger
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  postgres_prod_data:
  redis_prod_data:
  grafana_data:
