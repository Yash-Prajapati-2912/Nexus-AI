<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Color Gradients -->
    <linearGradient id="ecoGradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CFF" />
      <stop offset="50%" stop-color="#4F8CFF" />
      <stop offset="100%" stop-color="#4FD1FF" />
    </linearGradient>

    <linearGradient id="planGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CFF" />
      <stop offset="100%" stop-color="#4F8CFF" />
    </linearGradient>

    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#7C6CFF" />
    </linearGradient>

    <linearGradient id="groGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#4F8CFF" />
    </linearGradient>

    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C6CFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="connLinePlan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C6CFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="connLineFin" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C6CFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4FD1FF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="connLineCar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FD1FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="connLineGro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FD1FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Base -->
  <rect width="800" height="500" rx="32" fill="#0B0D12" />

  <!-- Connection Rays linking Central N to Ecosystem Nodes -->
  <!-- Top: Plan/Academics (400, 75) -->
  <line x1="400" y1="170" x2="400" y2="95" stroke="url(#connLinePlan)" stroke-width="4" stroke-dasharray="6 4" />

  <!-- Left: Finance (180, 220) -->
  <line x1="330" y1="220" x2="215" y2="220" stroke="url(#connLineFin)" stroke-width="4" stroke-dasharray="6 4" />

  <!-- Right: Career (620, 220) -->
  <line x1="470" y1="220" x2="585" y2="220" stroke="url(#connLineCar)" stroke-width="4" stroke-dasharray="6 4" />

  <!-- Bottom: Personal Growth (400, 365) -->
  <line x1="400" y1="270" x2="400" y2="345" stroke="url(#connLineGro)" stroke-width="4" stroke-dasharray="6 4" />

  <!-- Central Nexus N Symbol -->
  <g transform="translate(325, 145) scale(0.35)">
    <!-- Tilted Orbit -->
    <ellipse cx="215" cy="215" rx="180" ry="70" transform="rotate(-22 215 215)" fill="none" stroke="url(#ecoGradientMain)" stroke-width="6" stroke-dasharray="12 8" opacity="0.65" />

    <!-- N Path -->
    <path d="M 110 320 L 110 110 L 320 320 L 320 110" fill="none" stroke="url(#ecoGradientMain)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Outer Nodes -->
    <circle cx="110" cy="320" r="14" fill="#0B0D12" stroke="#7C6CFF" stroke-width="5" />
    <circle cx="110" cy="110" r="14" fill="#0B0D12" stroke="#7C6CFF" stroke-width="5" />
    <circle cx="320" cy="320" r="14" fill="#0B0D12" stroke="#4FD1FF" stroke-width="5" />
    <circle cx="320" cy="110" r="14" fill="#0B0D12" stroke="#4FD1FF" stroke-width="5" />

    <!-- AI Intelligence Core (Center) -->
    <circle cx="215" cy="215" r="50" fill="url(#aiGlow)" filter="url(#glowFilter)" />
    <circle cx="215" cy="215" r="22" fill="#F5F7FA" stroke="#4F8CFF" stroke-width="5" />
    <!-- Atom/AI Core Symbol inside central node -->
    <ellipse cx="215" cy="215" rx="12" ry="5" fill="none" stroke="#7C6CFF" stroke-width="2.5" transform="rotate(30 215 215)" />
    <ellipse cx="215" cy="215" rx="12" ry="5" fill="none" stroke="#4FD1FF" stroke-width="2.5" transform="rotate(-30 215 215)" />
  </g>

  <!-- 1. NODE: PLAN / ACADEMICS (Top: 400, 70) -->
  <g transform="translate(400, 70)">
    <circle cx="0" cy="0" r="28" fill="#1E1B4B" stroke="url(#planGrad)" stroke-width="3" />
    <!-- Graduation Cap Symbol -->
    <polygon points="0,-10 14,-3 0,4 -14,-3" fill="url(#planGrad)" />
    <polygon points="-8,-1 0,3 8,-1 8,6 0,9 -8,6" fill="none" stroke="url(#planGrad)" stroke-width="2" />
    <line x1="10" y1="-2" x2="10" y2="8" stroke="#4F8CFF" stroke-width="2" />
    <circle cx="10" cy="9" r="2" fill="#4F8CFF" />
    <text x="0" y="-36" font-family="'Poppins', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#A5B4FC" text-anchor="middle" letter-spacing="0.5">ACADEMICS &amp; PLAN</text>
  </g>

  <!-- 2. NODE: FINANCE (Left: 180, 220) -->
  <g transform="translate(180, 220)">
    <circle cx="0" cy="0" r="28" fill="#064E3B" stroke="url(#finGrad)" stroke-width="3" />
    <!-- Rupee Sign Symbol -->
    <text x="0" y="7" font-family="'Poppins', 'Inter', sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">₹</text>
    <text x="-40" y="3" font-family="'Poppins', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="end" letter-spacing="0.5">FINANCE</text>
  </g>

  <!-- 3. NODE: CAREER (Right: 620, 220) -->
  <g transform="translate(620, 220)">
    <circle cx="0" cy="0" r="28" fill="#451A03" stroke="url(#carGrad)" stroke-width="3" />
    <!-- Briefcase Symbol -->
    <rect x="-12" y="-6" width="24" height="16" rx="3" fill="none" stroke="url(#carGrad)" stroke-width="2.5" />
    <path d="M -6 -6 L -6 -10 Q -6 -12 -4 -12 L 4 -12 Q 6 -12 6 -10 L 6 -6" fill="none" stroke="url(#carGrad)" stroke-width="2" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="url(#carGrad)" stroke-width="2" />
    <text x="40" y="3" font-family="'Poppins', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#FCD34D" text-anchor="start" letter-spacing="0.5">CAREER</text>
  </g>

  <!-- 4. NODE: PERSONAL GROWTH (Bottom: 400, 370) -->
  <g transform="translate(400, 370)">
    <circle cx="0" cy="0" r="28" fill="#831843" stroke="url(#groGrad)" stroke-width="3" />
    <!-- Person & Progress Symbol -->
    <circle cx="0" cy="-7" r="5" fill="url(#groGrad)" />
    <path d="M -9 8 Q 0 0 9 8" fill="none" stroke="url(#groGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -11 3 L -5 -3 L 1 1 L 9 -7" fill="none" stroke="#4F8CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="5,-7 9,-7 9,-3" fill="none" stroke="#4F8CFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="0" y="44" font-family="'Poppins', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#F472B6" text-anchor="middle" letter-spacing="0.5">PERSONAL GROWTH</text>
  </g>

  <!-- Ecosystem Title & Wordmark (Center Bottom: 400, 445) -->
  <g transform="translate(400, 445)">
    <text x="-35" y="0" font-family="'Poppins', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#F5F7FA" text-anchor="end" letter-spacing="1">NEXUS</text>
    <text x="-25" y="0" font-family="'Poppins', 'Inter', sans-serif" font-size="28" font-weight="800" fill="url(#ecoGradientMain)" text-anchor="start" letter-spacing="1">AI</text>
    <text x="0" y="22" font-family="'Poppins', 'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.8">CONNECTED LIFE INTELLIGENCE</text>
  </g>
</svg>
