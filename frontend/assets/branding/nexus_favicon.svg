<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CFF" />
      <stop offset="50%" stop-color="#4F8CFF" />
      <stop offset="100%" stop-color="#4FD1FF" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="#0B0D12" />
  <!-- N symbol path with bold strokes -->
  <path d="M 8 25 L 8 7 L 24 25 L 24 7" 
        fill="none" 
        stroke="url(#favGrad)" 
        stroke-width="3.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <!-- 4 Corner Nodes -->
  <circle cx="8" cy="25" r="1.5" fill="#7C6CFF" />
  <circle cx="8" cy="7" r="1.5" fill="#7C6CFF" />
  <circle cx="24" cy="25" r="1.5" fill="#4FD1FF" />
  <circle cx="24" cy="7" r="1.5" fill="#4FD1FF" />
  <!-- Central Glowing Node -->
  <circle cx="16" cy="16" r="2.5" fill="#F5F7FA" stroke="#4F8CFF" stroke-width="0.8" />
</svg>
