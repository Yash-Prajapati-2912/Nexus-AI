<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Monochrome Orbit -->
  <ellipse cx="256" cy="256" rx="190" ry="75" 
           transform="rotate(-22 256 256)" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="5" 
           stroke-dasharray="14 10" 
           opacity="0.4" />

  <!-- Monochrome Orbit Nodes -->
  <circle cx="118" cy="205" r="7" fill="#FFFFFF" opacity="0.6" />
  <circle cx="394" cy="307" r="7" fill="#FFFFFF" opacity="0.6" />

  <!-- Monochrome N Path -->
  <path d="M 140 370 L 140 142 L 372 370 L 372 142" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Outer Endpoint Nodes -->
  <circle cx="140" cy="370" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="140" cy="142" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="372" cy="370" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="372" cy="142" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="6" />

  <!-- Central Core Node -->
  <circle cx="256" cy="256" r="22" fill="#FFFFFF" />
</svg>
