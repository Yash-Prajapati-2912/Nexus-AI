name: nexus_ai_admin
description: Enterprise Flutter Web Admin Panel for Nexus AI Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection & Router
  get_it: ^7.6.4
  go_router: ^13.0.0

  # Networking & HTTP
  dio: ^5.4.0

  # Charts & Web UI
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0

  # Storage & Utilities
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  fpdart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
